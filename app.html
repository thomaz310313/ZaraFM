<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="manifest" href="manifest.json?v=3">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Zara FM">
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js?reload=' + new Date().getTime()).then(function(reg) {
            reg.update();
        });
    }
    </script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zara FM | A Rádio mais felina de todas!</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #efa39a; 
            --primary-brown: #462c26; 
            --light-pink: #f7cac9;
            --white: #ffffff;
            --accent-red: #ff4757;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Fredoka', sans-serif; }
        
        body {
            background-color: var(--bg-color); 
            color: var(--primary-brown);
            background-image: radial-gradient(var(--light-pink) 1.5px, transparent 1.5px);
            background-size: 24px 24px; 
            min-height: 100vh;
            padding-bottom: 70px;
        }

        header {
            background: rgba(70, 44, 38, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            color: var(--white);
            padding: 20px 0; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
            margin-bottom: 40px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        header h1 { font-size: 2rem; letter-spacing: 3px; font-weight: 600; }

        .main-wrapper {
            max-width: 1000px; margin: 0 auto; display: grid;
            grid-template-columns: 1fr 1fr; gap: 30px; padding: 0 20px; align-items: start;
        }
        @media (max-width: 768px) { .main-wrapper { grid-template-columns: 1fr; } }

        .player-box, .card {
            position: relative;
            background: rgba(255, 255, 255, 0.35) !important;
            backdrop-filter: blur(25px) saturate(200%);
            -webkit-backdrop-filter: blur(25px) saturate(200%);
            padding: 35px 25px;
            border-radius: 36px !important;
            box-shadow: 0 20px 40px rgba(70, 44, 38, 0.15), inset 0 0 0 1px rgba(255, 255, 255, 0.6) !important;
            border: 1px solid rgba(255, 255, 255, 0.4) !important;
            text-align: center;
        }
        
        .player-box::before, .card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
            border-top-left-radius: 36px;
            border-top-right-radius: 36px;
        }

        .logo-container { margin-bottom: 25px; display: flex; justify-content: center; }
        .logo-container img {
            width: 100%; max-width: 240px; border-radius: 24px;
            filter: drop-shadow(0 15px 25px rgba(70, 44, 38, 0.3));
        }

        .status { font-size: 1.1rem; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .live-dot { width: 12px; height: 12px; background-color: var(--accent-red); border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(255, 71, 87, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); } }

        .now-playing { 
            background: rgba(255, 255, 255, 0.4); 
            padding: 16px; 
            border-radius: 22px; 
            margin-bottom: 25px; 
            width: 100%; 
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.5);
        }
        .now-playing p { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 5px; opacity: 0.75; }
        .now-playing h3 { font-size: 1.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Ações Dinâmicas (Compartilhar e Coração) */
        .actions-row {
            display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 25px;
        }

        .btn-share {
            background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.6);
            color: var(--primary-brown); padding: 10px 18px; border-radius: 20px;
            font-size: 0.95rem; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; gap: 8px; transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .btn-share:hover { background: rgba(255,255,255,0.8); transform: translateY(-2px); }
        .btn-share svg { fill: var(--primary-brown); width: 18px; height: 18px; }

        .heart-morph-btn {
            width: 42px; height: 42px; background: rgba(255,255,255,0.5);
            border: 1px solid rgba(255,255,255,0.6); border-radius: 50%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; position: relative; transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .heart-morph-btn:hover { background: rgba(255,255,255,0.8); transform: translateY(-2px); }
        .heart-morph-btn span {
            width: 20px; height: 3px; background-color: var(--primary-brown);
            border-radius: 3px; position: absolute;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        .heart-morph-btn span:nth-child(1) { transform: translateY(-6px); }
        .heart-morph-btn span:nth-child(2) { transform: translateY(0); }
        .heart-morph-btn span:nth-child(3) { transform: translateY(6px); }

        .heart-morph-btn.active { border-color: var(--accent-red); background: rgba(255,255,255,0.9); }
        .heart-morph-btn.active span:nth-child(2) { opacity: 0; transform: scale(0); }
        .heart-morph-btn.active span:nth-child(1), .heart-morph-btn.active span:nth-child(3) {
            width: 14px; height: 22px; background: transparent; border: 3px solid var(--accent-red);
            top: 7px;
        }
        .heart-morph-btn.active span:nth-child(1) {
            border-bottom: 0; border-right: 0; border-radius: 14px 14px 0 0;
            transform: rotate(-45deg) translate(-1px, 4px); left: 10px;
        }
        .heart-morph-btn.active span:nth-child(3) {
            border-bottom: 0; border-left: 0; border-radius: 14px 14px 0 0;
            transform: rotate(45deg) translate(1px, 4px); right: 10px;
        }

        .player-controls {
            display: flex; flex-direction: column; gap: 20px; align-items: center;
            background: rgba(255, 255, 255, 0.25); padding: 22px; border-radius: 26px;
            box-shadow: inset 0 2px 12px rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255,255,255,0.3);
        }

        .play-row { display: flex; align-items: center; justify-content: center; gap: 20px; width: 100%; }
        .play-btn {
            background: linear-gradient(180deg, #5c413b 0%, var(--primary-brown) 100%);
            border: 1px solid rgba(255,255,255,0.25); 
            width: 70px; height: 70px;
            border-radius: 50%; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(70, 44, 38, 0.35); display: flex; align-items: center; justify-content: center;
        }
        .play-btn:hover { transform: scale(1.06); filter: brightness(1.1); }
        .play-btn:active { transform: scale(0.94); }
        .play-btn svg { fill: #ffffff !important; }

        /* Canvas Substuindo as Barras CSS */
        #audioCanvas { width: 60px; height: 40px; display: none; }
        #audioCanvas.active { display: block; }

        .volume-container { display: flex; align-items: center; gap: 12px; width: 100%; }
        .volume-container svg { fill: var(--primary-brown) !important; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: var(--primary-brown); cursor: pointer; margin-top: -7px; box-shadow: 0 3px 6px rgba(0,0,0,0.25); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; background: rgba(255,255,255,0.6); border-radius: 5px; border: 1px solid rgba(255,255,255,0.4); }

        .info-box { display: flex; flex-direction: column; gap: 20px; }
        .card h2 { margin-bottom: 15px; font-size: 1.4rem; font-weight: 600; }
        .card p { line-height: 1.6; opacity: 0.9; margin-bottom: 20px; font-size: 1rem; }

        .input-pedido { 
            width: 100%; padding: 14px; margin-bottom: 14px; border-radius: 18px; 
            border: 1px solid rgba(255,255,255,0.7) !important; outline: none; 
            font-family: 'Fredoka', sans-serif; font-size: 1rem; color: var(--primary-brown); 
            background: rgba(255,255,255,0.55) !important; 
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.04);
            transition: 0.2s;
        }
        .input-pedido:focus { border-color: var(--primary-brown) !important; background: rgba(255,255,255,0.85) !important; }

        .btn-enviar { 
            width: 100%; 
            background: linear-gradient(180deg, #5c413b 0%, var(--primary-brown) 100%); 
            color: var(--white); padding: 14px; border-radius: 18px; 
            border: 1px solid rgba(255,255,255,0.25); 
            font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.3s; 
            box-shadow: 0 6px 15px rgba(70, 44, 38, 0.3); 
            text-shadow: 0 1px 1px rgba(0,0,0,0.2);
        }
        .btn-enviar:hover { filter: brightness(1.12); transform: translateY(-2px); }

        #version-badge {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background: rgba(70, 44, 38, 0.85);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            z-index: 998;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.2);
            letter-spacing: 0.5px;
        }

        #dvd-screensaver {
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 9999; 
            overflow: hidden;
        }
        #dvd-logo {
            position: absolute;
            width: 200px; 
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.3));
        }
    </style>
</head>
<body>

    <header>
        <h1>ZARA FM</h1>
    </header>

    <div class="main-wrapper">
        <div class="player-box">
            <div class="logo-container">
                <img src="zaralogo.png?v=3" alt="Logo Zara FM">
            </div>

            <div class="status">
                <div class="live-dot" id="liveIndicator" style="display: none;"></div>
                <span id="statusText">Rádio Offline</span>
            </div>

            <div class="now-playing">
                <p>🎵 Tocando Agora</p>
                <h3 id="songTitle">Aguardando rádio...</h3>
            </div>

            <div class="actions-row">
                <button id="shareBtn" class="btn-share">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
                    <span>Compartilhar</span>
                </button>

                <div id="heartBtn" class="heart-morph-btn" title="Curtir Rádio">
                    <span></span><span></span><span></span>
                </div>
            </div>

            <div class="player-controls">
                <div class="play-row">
                    <button class="play-btn" id="playPauseBtn">
                        <span id="iconContainer">
                            <svg viewBox="0 0 24 24" width="28" height="28"><path d="M8 5v14l11-7z"/></svg>
                        </span>
                    </button>

                    <canvas id="audioCanvas" width="80" height="40"></canvas>
                </div>

                <div class="volume-container">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/></svg>
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </div>
            </div>
        </div>

        <div class="info-box">
            <div class="card">
                <h2>🎧 A Rádio Oficial</h2>
                <p>Você está ouvindo a Zara FM! Transmitindo os melhores hits pop, agora online.</p>

                <h2>💬 Peça sua Música</h2>
                <p style="font-size: 0.95rem; margin-bottom: 15px;">Mande sua sugestão e ela vai direto pro painel do estúdio!</p>
                
                <form id="formPedido">
                    <input type="text" id="nomeOuvinte" class="input-pedido" placeholder="Seu Nome" required>
                    <input type="text" id="nomeMusica" class="input-pedido" placeholder="Música e Artista" required>
                    <button type="submit" id="btnEnviar" class="btn-enviar">Enviar Pedido 🎶</button>
                </form>
                <p id="mensagemStatus" style="margin-top: 12px; font-size: 0.9rem; font-weight: 600;"></p>
            </div>
        </div>
    </div>

    <div id="version-badge">v0.30 • Atualizado</div>

    <div id="dvd-screensaver">
        <img id="dvd-logo" src="zaralogo.png?v=3" alt="ZaraFM Logo">
    </div>

    <audio id="audioStream" crossorigin="anonymous" preload="none"></audio>

    <script>
        var versaoLocalSite = "0.30";
        var badgeVersion = document.getElementById('version-badge');

        var xhrVer = new XMLHttpRequest();
        xhrVer.open('GET', 'version.json?t=' + new Date().getTime(), true);
        xhrVer.onreadystatechange = function() {
            if (xhrVer.readyState === 4 && xhrVer.status === 200) {
                try {
                    var dadosVersao = JSON.parse(xhrVer.responseText);
                    if (dadosVersao.version !== versaoLocalSite) {
                        badgeVersion.innerText = "Atualizando...";
                        if ('caches' in window) {
                            caches.keys().then(function(names) {
                                for (var i = 0; i < names.length; i++) {
                                    caches.delete(names[i]);
                                }
                            });
                        }
                        localStorage.clear();
                        setTimeout(function() {
                            window.location.reload(true);
                        }, 1000);
                    }
                } catch(e) {}
            }
        };
        xhrVer.send();

        var audio = document.getElementById('audioStream');
        var playPauseBtn = document.getElementById('playPauseBtn');
        var iconContainer = document.getElementById('iconContainer');
        var volumeSlider = document.getElementById('volumeSlider');
        var statusText = document.getElementById('statusText');
        var liveIndicator = document.getElementById('liveIndicator');
        var songTitleText = document.getElementById('songTitle');

        var playSvg = '<svg viewBox="0 0 24 24" width="28" height="28"><path d="M8 5v14l11-7z"/></svg>';
        var pauseSvg = '<svg viewBox="0 0 24 24" width="28" height="28"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

        var urlLogoAbsoluta = 'https://zarafm.xyz/zaralogo.png?v=3';
        var tituloOriginal = "Zara FM | A Rádio mais felina de todas!";
        var isPlaying = false;

        // Variáveis do Canvas (Web Audio API)
        var audioCtx, analyser, source, dataArray, bufferLength;
        var canvas = document.getElementById('audioCanvas');
        var canvasCtx = canvas.getContext('2d');
        var visualizerId;

        function initAudioVisualizer() {
            if (audioCtx) return;
            try {
                var AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                analyser = audioCtx.createAnalyser();
                source = audioCtx.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                
                analyser.fftSize = 64; 
                bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
            } catch (e) {
                console.log("Web Audio API bloqueada.");
            }
        }

        function drawVisualizer() {
            if (!isPlaying || !analyser) return;
            visualizerId = requestAnimationFrame(drawVisualizer);
            
            analyser.getByteFrequencyData(dataArray);
            canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
            
            var numBars = 6;
            var barWidth = (canvas.width / numBars) - 2;
            var barHeight;
            var x = 0;

            for (var i = 0; i < numBars; i++) {
                barHeight = (dataArray[i] / 255) * canvas.height; 
                if (barHeight < 2) barHeight = 2; 

                canvasCtx.fillStyle = '#462c26';
                canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                x += barWidth + 2;
            }
        }

        // Compartilhar
        document.getElementById('shareBtn').addEventListener('click', function() {
            var musicaAtual = songTitleText.innerText !== "Aguardando rádio..." ? songTitleText.innerText : "Zara FM";
            var texto = "Tô ouvindo " + musicaAtual + " na Zara FM! 🐾";
            var url = "https://zarafm.xyz";

            if (navigator.share) {
                navigator.share({ title: 'Zara FM', text: texto, url: url }).catch(function(){});
            } else {
                navigator.clipboard.writeText(texto + " - " + url);
                var span = this.querySelector('span');
                var txtAntigo = span.innerText;
                span.innerText = "Copiado!";
                setTimeout(function() { span.innerText = txtAntigo; }, 2000);
            }
        });

        // Coração Animado
        document.getElementById('heartBtn').addEventListener('click', function() {
            this.classList.toggle('active');
        });

        function atualizarBolhaCelular(nomeFaixa) {

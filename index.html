<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Zara FM">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW falhou, mas a rádio segue viva:', err));
        }
    </script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zara FM | A Rádio mais felina de todas!</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #efa39a; 
            --primary-brown: #462c26; 
            --light-pink: #f7cac9;
            --white: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Fredoka', sans-serif; }
        
        body {
            background-color: var(--bg-color); 
            color: var(--primary-brown);
            background-image: radial-gradient(var(--light-pink) 1.5px, transparent 1.5px);
            background-size: 24px 24px; 
            min-height: 100vh;
            padding-bottom: 50px;
        }

        header {
            background: rgba(70, 44, 38, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            color: var(--white);
            padding: 20px 0; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
            margin-bottom: 40px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        header h1 { font-size: 2rem; letter-spacing: 3px; font-weight: 600; }

        .main-wrapper {
            max-width: 1000px; margin: 0 auto; display: grid;
            grid-template-columns: 1fr 1fr; gap: 30px; padding: 0 20px; align-items: start;
        }
        @media (max-width: 768px) { .main-wrapper { grid-template-columns: 1fr; } }

        .player-box, .card {
            position: relative;
            background: rgba(255, 255, 255, 0.35) !important;
            backdrop-filter: blur(25px) saturate(200%);
            -webkit-backdrop-filter: blur(25px) saturate(200%);
            padding: 35px 25px;
            border-radius: 36px !important;
            box-shadow: 0 20px 40px rgba(70, 44, 38, 0.15), inset 0 0 0 1px rgba(255, 255, 255, 0.6) !important;
            border: 1px solid rgba(255, 255, 255, 0.4) !important;
            text-align: center;
        }
        
        .player-box::before, .card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
            border-top-left-radius: 36px;
            border-top-right-radius: 36px;
        }

        .logo-container { margin-bottom: 25px; display: flex; justify-content: center; }
        .logo-container img {
            width: 100%; max-width: 240px; border-radius: 24px;
            filter: drop-shadow(0 15px 25px rgba(70, 44, 38, 0.3));
        }

        .status { font-size: 1.1rem; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .live-dot { width: 12px; height: 12px; background-color: #ff4757; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(255, 71, 87, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); } }

        .now-playing { 
            background: rgba(255, 255, 255, 0.4); 
            padding: 16px; 
            border-radius: 22px; 
            margin-bottom: 25px; 
            width: 100%; 
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.5);
        }
        .now-playing p { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 5px; opacity: 0.75; }
        .now-playing h3 { font-size: 1.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .player-controls {
            display: flex; flex-direction: column; gap: 20px; align-items: center;
            background: rgba(255, 255, 255, 0.25); padding: 22px; border-radius: 26px;
            box-shadow: inset 0 2px 12px rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255,255,255,0.3);
        }

        .play-row { display: flex; align-items: center; justify-content: center; gap: 15px; width: 100%; }
        .play-btn {
            background: linear-gradient(180deg, #5c413b 0%, var(--primary-brown) 100%);
            border: 1px solid rgba(255,255,255,0.25); 
            width: 70px; height: 70px;
            border-radius: 50%; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(70, 44, 38, 0.35); display: flex; align-items: center; justify-content: center;
        }
        .play-btn:hover { transform: scale(1.06); filter: brightness(1.1); }
        .play-btn:active { transform: scale(0.94); }
        .play-btn svg { fill: #ffffff !important; }

        .volume-container svg { fill: var(--primary-brown) !important; }
        .visualizer { display: flex; gap: 4px; height: 30px; align-items: flex-end; opacity: 0; width: 40px; justify-content: center; }
        .visualizer.active { opacity: 1; }
        .bar { width: 5px; background-color: var(--primary-brown); border-radius: 3px; height: 5px; }
        .visualizer.active .bar { animation: bounce 0.5s infinite alternate; }
        .visualizer.active .bar:nth-child(2) { animation-delay: 0.1s; }
        .visualizer.active .bar:nth-child(3) { animation-delay: 0.2s; }
        .visualizer.active .bar:nth-child(4) { animation-delay: 0.3s; }
        @keyframes bounce { 0% { height: 5px; } 100% { height: 30px; } }

        .volume-container { display: flex; align-items: center; gap: 12px; width: 100%; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: var(--primary-brown); cursor: pointer; margin-top: -7px; box-shadow: 0 3px 6px rgba(0,0,0,0.25); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; background: rgba(255,255,255,0.6); border-radius: 5px; border: 1px solid rgba(255,255,255,0.4); }

        .info-box { display: flex; flex-direction: column; gap: 20px; }
        .card h2 { margin-bottom: 15px; font-size: 1.4rem; font-weight: 600; }
        .card p { line-height: 1.6; opacity: 0.9; margin-bottom: 20px; font-size: 1rem; }

        .input-pedido { 
            width: 100%; padding: 14px; margin-bottom: 14px; border-radius: 18px; 
            border: 1px solid rgba(255,255,255,0.7) !important; outline: none; 
            font-family: 'Fredoka', sans-serif; font-size: 1rem; color: var(--primary-brown); 
            background: rgba(255,255,255,0.55) !important; 
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.04);
            transition: 0.2s;
        }
        .input-pedido:focus { border-color: var(--primary-brown) !important; background: rgba(255,255,255,0.85) !important; }

        .btn-enviar { 
            width: 100%; 
            background: linear-gradient(180deg, #5c413b 0%, var(--primary-brown) 100%); 
            color: var(--white); padding: 14px; border-radius: 18px; 
            border: 1px solid rgba(255,255,255,0.25); 
            font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.3s; 
            box-shadow: 0 6px 15px rgba(70, 44, 38, 0.3); 
            text-shadow: 0 1px 1px rgba(0,0,0,0.2);
        }
        .btn-enviar:hover { filter: brightness(1.12); transform: translateY(-2px); }

        #dvd-screensaver {
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 9999; 
            overflow: hidden;
        }
        #dvd-logo {
            position: absolute;
            width: 200px; 
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.3));
        }
    </style>
</head>
<body>

    <header>
        <h1>ZARA FM</h1>
    </header>

    <div class="main-wrapper">
        <div class="player-box">
            <div class="logo-container">
                <img src="zaralogo.png" alt="Logo Zara FM">
            </div>

            <div class="status">
                <div class="live-dot" id="liveIndicator" style="display: none;"></div>
                <span id="statusText">Rádio Offline</span>
            </div>

            <div class="now-playing">
                <p>🎵 Tocando Agora</p>
                <h3 id="songTitle">Aguardando rádio...</h3>
            </div>

            <div class="player-controls">
                <div class="play-row">
                    <button class="play-btn" id="playPauseBtn">
                        <span id="iconContainer">
                            <svg viewBox="0 0 24 24" width="28" height="28"><path d="M8 5v14l11-7z"/></svg>
                        </span>
                    </button>

                    <div class="visualizer" id="visualizer">
                        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    </div>
                </div>

                <div class="volume-container">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/></svg>
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </div>
            </div>
        </div>

        <div class="info-box">
            <div class="card">
                <h2>🎧 A Rádio Oficial</h2>
                <p>Você está ouvindo a Zara FM! Transmitindo os melhores hits pop, agora online.</p>

                <h2>💬 Peça sua Música</h2>
                <p style="font-size: 0.95rem; margin-bottom: 15px;">Mande sua sugestão e ela vai direto para o painel do estúdio!</p>
                
                <form id="formPedido">
                    <input type="text" id="nomeOuvinte" class="input-pedido" placeholder="Seu Nome" required>
                    <input type="text" id="nomeMusica" class="input-pedido" placeholder="Música e Artista" required>
                    <button type="submit" id="btnEnviar" class="btn-enviar">Enviar Pedido 🎶</button>
                </form>
                <p id="mensagemStatus" style="margin-top: 12px; font-size: 0.9rem; font-weight: 600;"></p>
            </div>
        </div>
    </div>

    <div id="dvd-screensaver">
        <img id="dvd-logo" src="zaralogo.png" alt="ZaraFM Logo">
    </div>

    <audio id="audioStream" preload="none"></audio>

    <script>
        const audio = document.getElementById('audioStream');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const iconContainer = document.getElementById('iconContainer');
        const volumeSlider = document.getElementById('volumeSlider');
        const statusText = document.getElementById('statusText');
        const liveIndicator = document.getElementById('liveIndicator');
        const visualizer = document.getElementById('visualizer');
        const songTitleText = document.getElementById('songTitle');

        const playSvg = '<svg viewBox="0 0 24 24" width="28" height="28"><path d="M8 5v14l11-7z"/></svg>';
        const pauseSvg = '<svg viewBox="0 0 24 24" width="28" height="28"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

        let isPlaying = false;

        playPauseBtn.addEventListener('click', () => {
            if (isPlaying) {
                audio.pause();
                audio.src = ""; 
                iconContainer.innerHTML = playSvg;
                statusText.innerText = "Pausado";
                liveIndicator.style.display = "none";
                visualizer.classList.remove('active');
                isPlaying = false;
            } else {
                statusText.innerText = "Conectando...";
                const urlAoVivo = "https://radio.zarafm.xyz/aovivo?_=" + new Date().getTime();
                audio.src = urlAoVivo;

                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        iconContainer.innerHTML = pauseSvg;
                        statusText.innerText = "Ao Vivo";
                        liveIndicator.style.display = "block";
                        visualizer.classList.add('active');
                        isPlaying = true;
                        buscarNomeDaMusica();
                    }).catch((error) => {
                        console.error("Erro:", error);
                        statusText.innerText = "Erro. Tente novamente";
                        iconContainer.innerHTML = playSvg;
                        isPlaying = false;
                    });
                }
            }
        });

        volumeSlider.addEventListener('input', (e) => { audio.volume = e.target.value; });

        audio.addEventListener('error', () => {
            if (isPlaying) {
                statusText.innerText = "Sinal Perdido";
                liveIndicator.style.display = "none";
                visualizer.classList.remove('active');
                iconContainer.innerHTML = playSvg;
                isPlaying = false;
            }
        });

        async function buscarNomeDaMusica() {
            if (!isPlaying) return;

            try {
                const urlStatus = 'https://radio.zarafm.xyz/status-json.xsl?nocache=' + new Date().getTime();
                const resposta = await fetch(urlStatus);
                const dados = await resposta.json();

                let titulo = "";

                if (dados.icestats && dados.icestats.source) {
                    let fonte = Array.isArray(dados.icestats.source) ? dados.icestats.source[0] : dados.icestats.source;
                    
                    if (fonte.metadata && fonte.metadata.x_icy_title) {
                        titulo = fonte.metadata.x_icy_title;
                    } else if (fonte.title) {
                        titulo = fonte.title;
                    }

                    if (titulo) {
                        titulo = titulo.split('\t').pop();
                        titulo = titulo.split('\\').pop().split('/').pop();
                        titulo = titulo.replace(/_spotdown\.org|_spotdown/gi, "");
                        titulo = titulo.replace(/\.mp3|\.webm|\.m4a|\.wav/gi, "");
                        titulo = titulo.trim().replace(/^-+|-+$/g, '');
                    }
                }

                if (titulo && titulo !== "") {
                    songTitleText.innerText = titulo;
                    
                    // Integração: API de Notificação de Mídia (Bolha do Celular)
                    if ('mediaSession' in navigator) {
                        navigator.mediaSession.metadata = new MediaMetadata({
                            title: titulo,
                            artist: 'Zara FM',
                            album: 'Ao Vivo',
                            artwork: [
                                { src: 'zaralogo.png', sizes: '512x512', type: 'image/png' }
                            ]
                        });
                    }
                } else {
                    songTitleText.innerText = "Zara FM - 106.9";
                }
            } catch (erro) {
                console.error("Erro ao buscar metadados:", erro);
                songTitleText.innerText = "Transmissão Ao Vivo";
            }

            setTimeout(buscarNomeDaMusica, 10000);
        }

        document.getElementById('formPedido').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnEnviar');
            const status = document.getElementById('mensagemStatus');
            const ouvinte = document.getElementById('nomeOuvinte').value;
            const musica = document.getElementById('nomeMusica').value;

            btn.disabled = true;
            btn.innerText = "Enviando...";
            
            try {
                const resposta = await fetch('https://zararequests.discloud.app/pedir', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ouvinte, musica })
                });

                if(resposta.ok) {
                    status.innerText = "✅ Pedido enviado com sucesso!";
                    status.style.color = "#2e7d32";
                    this.reset();
                } else {
                    throw new Error();
                }
            } catch (err) {
                status.innerText = "❌ Erro ao enviar, tente de novo.";
                status.style.color = "#c62828";
            } finally {
                btn.disabled = false;
                btn.innerText = "Enviar Pedido 🎶";
                setTimeout(() => { status.innerText = ""; }, 5000);
            }
        });

        const screensaver = document.getElementById('dvd-screensaver');
        const logo = document.getElementById('dvd-logo');
        let timeoutDvd;
        let x = 0, y = 0, dirX = 1, dirY = 1, speed = 2.5;
        let animationId;

        function resetTimerDvd() {
            screensaver.style.display = 'none'; 
            cancelAnimationFrame(animationId); 
            clearTimeout(timeoutDvd);
            
            timeoutDvd = setTimeout(() => {
                screensaver.style.display = 'block'; 
                x = Math.random() * (window.innerWidth - logo.clientWidth);
                y = Math.random() * (window.innerHeight - logo.clientHeight);
                animarLogo(); 
            }, 180000); 
        }

        function animarLogo() {
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;
            const logoW = logo.clientWidth;
            const logoH = logo.clientHeight;

            x += dirX * speed;
            y += dirY * speed;

            if (x + logoW >= screenW || x <= 0) dirX *= -1;
            if (y + logoH >= screenH || y <= 0) dirY *= -1;

            logo.style.left = x + 'px';
            logo.style.top = y + 'px';

            animationId = requestAnimationFrame(animarLogo);
        }

        window.addEventListener('mousemove', resetTimerDvd);
        window.addEventListener('keydown', resetTimerDvd);
        window.addEventListener('touchstart', resetTimerDvd);
        window.addEventListener('scroll', resetTimerDvd);

        resetTimerDvd();
    </script>
</body>
</html>
